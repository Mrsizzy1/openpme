services:
  postgres:
    image: postgres:17-alpine
    container_name: openpme_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smart_pme_finance}
    # Accessible uniquement depuis la machine hôte (sauvegardes, administration), jamais depuis le réseau.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: openpme_api
    restart: always
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-smart_pme_finance}?schema=public"
      PORT: 3001
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Trust nginx (private Docker network) so rate limits and audit logs see the real client IP.
      TRUST_PROXY: ${TRUST_PROXY:-loopback, uniquelocal}
      # Laisser vide en HTTPS. "false" uniquement pour un réseau local sans HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: openpme_web
    restart: always
    ports:
      - "5173:8080"
    depends_on:
      - api

volumes:
  postgres_data:
