name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  api:
    name: API — build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build:shared
      - name: Compile API (tsc)
        run: npm run build:api
      - name: API tests
        run: npm test

  web:
    name: Web — tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Web tests (vitest)
        run: npm --workspace=apps/web run test
      - name: Type-check and build (tsc + vite)
        run: npm --workspace=apps/web run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t openpme-api:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t openpme-web:ci .
      - name: Validate docker-compose file
        run: POSTGRES_PASSWORD=ci JWT_SECRET=ci-secret-with-at-least-32-characters docker compose config --quiet
